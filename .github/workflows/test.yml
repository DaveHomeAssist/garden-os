name: Tests

# Runs the same verification gates as the "build" job in pages.yml so pull
# requests are tested before merge (pages.yml only runs on push to main).
# The job name "Verify (story-mode + verify-all)" is stable so it can be marked
# as a required status check in branch protection.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Runner selection: GitHub-hosted ubuntu-latest unless the repo variable
# GARDEN_OS_RUNNER is set (Settings > Secrets and variables > Actions >
# Variables), e.g. to a self-hosted runner label such as "garden-os".
# Pull requests from forks always use ubuntu-latest so outside code never runs
# on a self-hosted machine. Steps run in bash; on a Windows runner that is Git
# for Windows' bash, which must be on PATH.
defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (story-mode + verify-all)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: story-mode/package-lock.json

      - name: Install Story Mode dependencies
        working-directory: story-mode
        run: npm ci

      - name: Install Playwright browser
        working-directory: story-mode
        # --with-deps installs Linux system packages (needs sudo on a
        # self-hosted Linux box); Windows and macOS need no extra packages.
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Verify Story Mode design-language viewports
        run: node tests/story-mode-design-language-diagnostic.mjs

      - name: Verify all
        run: node scripts/verify-all.mjs
