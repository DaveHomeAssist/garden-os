name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runner selection: GitHub-hosted ubuntu-latest unless the repo variable
# GARDEN_OS_RUNNER is set to a self-hosted runner label (see test.yml). This
# workflow only runs on push to main and manual dispatch, never on fork code.
# Steps run in bash; on a Windows runner that is Git for Windows' bash.
defaults:
  run:
    shell: bash

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: story-mode/package-lock.json

      - name: Install Story Mode dependencies
        working-directory: story-mode
        run: npm ci

      - name: Install Playwright browser
        working-directory: story-mode
        env:
          WITH_DEPS: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        # Hosted Linux runners install Chromium's system packages with
        # --with-deps (apt). Self-hosted runners never run apt from CI: their
        # system libraries are provisioned on the machine (the box runner's
        # install-deps.sh), so CI only checks them and installs the browser.
        run: |
          if [ "$WITH_DEPS" = "true" ]; then
            npx playwright install --with-deps chromium
          else
            if [ "$RUNNER_OS" = "Linux" ] && ! npx playwright install-deps --dry-run chromium | grep -q 'All system dependencies are installed'; then
              echo "::warning::Playwright system dependencies are missing on this self-hosted runner. CI does not install them (no apt); provision them on the machine."
            fi
            npx playwright install chromium
          fi

      - name: Verify Story Mode design-language viewports
        run: node tests/story-mode-design-language-diagnostic.mjs

      - name: Verify before deploy
        run: node scripts/verify-all.mjs

      - name: Precompile root page JSX
        # The root React pages ship their JSX in a text/babel block. Compile it
        # here so phones no longer download and run babel-standalone (about
        # 650 KiB, render blocking) on every cold load. Source files stay as
        # written; only this artifact is rewritten. Runs before staging because
        # it uses Story Mode's esbuild and Playwright.
        run: node story-mode/scripts/precompile-root-jsx.mjs --write

      - name: Check precompiled root pages in a browser
        env:
          PRECOMPILED_ONLY: '1'
        run: node tests/precompiled-root-pages-regression.mjs

      - name: Stage Story Mode for Pages
        run: |
          cp -rf story-mode/dist/* story-mode/
          rm -rf story-mode/dist story-mode/node_modules story-mode/src story-mode/package*.json story-mode/vite.config.js

      - name: Stamp service worker cache version
        # Every deploy gets its own service worker cache, so activate purges the
        # previous deploy's HTML and assets instead of serving them offline.
        run: |
          STAMP="$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          sed -i -E "s/^const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${STAMP}';/" sw.js
          grep -q "^const CACHE_VERSION = '${STAMP}';" sw.js || { echo "::error::sw.js CACHE_VERSION was not stamped"; exit 1; }
          echo "sw.js CACHE_VERSION=${STAMP}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Post-deploy smoke
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: story-mode/package-lock.json

      - name: Install Story Mode dependencies
        working-directory: story-mode
        run: npm ci

      - name: Install Playwright browser
        working-directory: story-mode
        env:
          WITH_DEPS: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        # Hosted Linux runners install Chromium's system packages with
        # --with-deps (apt). Self-hosted runners never run apt from CI: their
        # system libraries are provisioned on the machine (the box runner's
        # install-deps.sh), so CI only checks them and installs the browser.
        run: |
          if [ "$WITH_DEPS" = "true" ]; then
            npx playwright install --with-deps chromium
          else
            if [ "$RUNNER_OS" = "Linux" ] && ! npx playwright install-deps --dry-run chromium | grep -q 'All system dependencies are installed'; then
              echo "::warning::Playwright system dependencies are missing on this self-hosted runner. CI does not install them (no apt); provision them on the machine."
            fi
            npx playwright install chromium
          fi

      - name: Smoke live Story Mode
        run: node scripts/verify-all.mjs --live-only --live-url https://davehomeassist.github.io/garden-os/story-mode/

      - name: Verify live Story Mode field-kit viewports
        env:
          GOS_DESIGN_BASE_URL: https://davehomeassist.github.io/garden-os/story-mode/
        run: node tests/story-mode-design-language-diagnostic.mjs
