name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runner selection: GitHub-hosted ubuntu-latest unless the repo variable
# GARDEN_OS_RUNNER is set to a self-hosted runner label (see test.yml). This
# workflow only runs on push to main and manual dispatch, never on fork code.
# Steps run in bash; on a Windows runner that is Git for Windows' bash.
defaults:
  run:
    shell: bash

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs first so its base_path ("/garden-os" on github.io, "" on a custom
      # domain) sets the site root the build is served from (GOS_SITE_BASE).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: story-mode/package-lock.json

      - name: Install Story Mode dependencies
        working-directory: story-mode
        run: npm ci

      - name: Install Playwright browser
        working-directory: story-mode
        env:
          WITH_DEPS: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        # Hosted Linux runners install Chromium's system packages with
        # --with-deps (apt). Self-hosted runners never run apt from CI: their
        # system libraries are provisioned on the machine (the box runner's
        # install-deps.sh), so CI only checks them and installs the browser.
        run: |
          if [ "$WITH_DEPS" = "true" ]; then
            npx playwright install --with-deps chromium
          else
            if [ "$RUNNER_OS" = "Linux" ] && ! npx playwright install-deps --dry-run chromium | grep -q 'All system dependencies are installed'; then
              echo "::warning::Playwright system dependencies are missing on this self-hosted runner. CI does not install them (no apt); provision them on the machine."
            fi
            npx playwright install chromium
          fi

      - name: Verify Story Mode design-language viewports
        env:
          GOS_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: node tests/story-mode-design-language-diagnostic.mjs

      - name: Verify before deploy
        env:
          GOS_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: node scripts/verify-all.mjs

      - name: Stage Story Mode for Pages
        run: |
          cp -rf story-mode/dist/* story-mode/
          rm -rf story-mode/dist story-mode/node_modules story-mode/src story-mode/package*.json story-mode/vite.config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Post-deploy smoke
    runs-on: ${{ vars.GARDEN_OS_RUNNER || 'ubuntu-latest' }}
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: story-mode/package-lock.json

      - name: Install Story Mode dependencies
        working-directory: story-mode
        run: npm ci

      - name: Install Playwright browser
        working-directory: story-mode
        env:
          WITH_DEPS: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        # Hosted Linux runners install Chromium's system packages with
        # --with-deps (apt). Self-hosted runners never run apt from CI: their
        # system libraries are provisioned on the machine (the box runner's
        # install-deps.sh), so CI only checks them and installs the browser.
        run: |
          if [ "$WITH_DEPS" = "true" ]; then
            npx playwright install --with-deps chromium
          else
            if [ "$RUNNER_OS" = "Linux" ] && ! npx playwright install-deps --dry-run chromium | grep -q 'All system dependencies are installed'; then
              echo "::warning::Playwright system dependencies are missing on this self-hosted runner. CI does not install them (no apt); provision them on the machine."
            fi
            npx playwright install chromium
          fi

      # page_url is the deployed site root: https://davehomeassist.github.io/garden-os/
      # today, the custom domain after cutover. Normalised so a missing trailing
      # slash (or an empty output) still gives a valid Story Mode URL.
      - name: Smoke live Story Mode
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          site="${PAGE_URL:-https://davehomeassist.github.io/garden-os/}"
          node scripts/verify-all.mjs --live-only --live-url "${site%/}/story-mode/"

      - name: Verify live Story Mode field-kit viewports
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          site="${PAGE_URL:-https://davehomeassist.github.io/garden-os/}"
          GOS_DESIGN_BASE_URL="${site%/}/story-mode/" node tests/story-mode-design-language-diagnostic.mjs
